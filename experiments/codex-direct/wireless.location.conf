# Review candidate only. Include in the approved existing HTTPS server block after authorization.
# Independent Codex route; leave the existing Paseo route and relay untouched.
location ^~ /rayneo-codex/ {
    limit_except GET POST { deny all; }
    client_max_body_size 64k;
    proxy_pass https://127.0.0.1:17469/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/rayneo-paseo/bridge-ca.pem;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_ssl_verify_depth 1;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering on;
    proxy_next_upstream off;
    proxy_connect_timeout 8s;
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;
    access_log off;
}
